services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: mro_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: mro
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mro_owner -d mro"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  mro_pgdata:
