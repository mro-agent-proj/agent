[project]
name = "mro-rag"
version = "0.1.0"
description = "Read-only MRO evidence MCP backed by PostgreSQL and pgvector"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pgvector>=0.4,<1", "mcp>=1.28,<2", "uvicorn>=0.34,<1",
  "pyjwt>=2.10,<3", "jsonschema>=4.23,<5", "numpy>=2,<3",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
mro-rag = "mro_rag.cli:main"
mro-business-mcp = "mro_mcp.business.server:main"
mro-rag-mcp = "mro_mcp.rag.server:main"

# Query embeddings run on CPU (MRO_EMBED_DEVICE=cpu). On Linux, PyPI's default torch wheel bundles CUDA
# (~4 GB of nvidia-* packages); take the CPU-only wheel instead. macOS wheels on PyPI are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mro_rag", "src/mro_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/migrations", "/integration", "/scripts", "/docs/spec-v1/mcp-tool-contracts.json", "/README.md", "/pyproject.toml", "/uv.lock", "/alembic.ini", "/compose.yaml", "/Makefile", "/.python-version"]

[tool.ruff.lint.isort]
known-first-party = ["mro_rag", "mro_mcp"]
known-third-party = ["mcp"]
