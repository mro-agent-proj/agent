# Backend owns Postgres, migrations, accounts and data restoration.
# Fill .env.mcp from .env.mcp.example, then:
# docker compose --env-file .env.mcp -f compose.mcp.yaml up -d --build
services:
  business-mcp:
    build:
      context: .
      dockerfile: docker/business-mcp.Dockerfile
    environment:
      BUSINESS_DATABASE_URL: ${BUSINESS_DATABASE_URL:?Set the mro_business_reader URL in .env.mcp}
      BUSINESS_ALLOWED_HOSTS: 127.0.0.1:*,localhost:*,business-mcp:*
      BUSINESS_SOURCE_VERSION: ${BUSINESS_SOURCE_VERSION:-backend-seed}
      BUSINESS_JWT_SECRET: ${BUSINESS_JWT_SECRET:?Set the backend-compatible signing secret (mro.mcp.business-jwt-secret)}
    ports:
      - "127.0.0.1:8101:8101"
    networks:
      - backend
    restart: unless-stopped

  rag-mcp:
    build:
      context: .
      dockerfile: docker/rag-mcp.Dockerfile
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set the mro_reader URL in .env.mcp}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?Set the backend-compatible signing secret (mro.mcp.rag-jwt-secret)}
      RAG_CURSOR_SECRET: ${RAG_CURSOR_SECRET:?Set a separate cursor secret}
      RAG_ALLOWED_HOSTS: 127.0.0.1:*,localhost:*,rag-mcp:*
      # R02·R04 의미 검색 질의 임베딩(OpenAI text-embedding-3-large@1024). 비우면 단어 검색만 합니다.
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8102:8102"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    name: ${BACKEND_NETWORK:-backend_default}
    external: true
